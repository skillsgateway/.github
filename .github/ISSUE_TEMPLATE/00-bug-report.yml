# Deliberately generic. This file is public; a component dropdown naming
# subsystems would disclose the architecture ahead of the source. Add one in a
# repository's own ISSUE_TEMPLATE/ if it needs it — a repository's templates
# override these.
name: Bug report
description: Report a bug or unexpected behavior
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more detail you give, the
        faster it can be reproduced.

        **Do not report security vulnerabilities here.** Use a
        [private security advisory](https://github.com/skillsgateway/.github/security/advisories/new)
        instead.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: This is a bug report, not a support or usage question
          required: true
        - label: I have searched existing issues and found no duplicate
          required: true
        - label: This is not a security vulnerability
          required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release version, or the commit SHA if building from source.
      placeholder: "e.g. 1.2.3, or 5d35025"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The behavior you actually observed.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal sequence that triggers it.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Relevant log output. This is automatically formatted as code, so no
        backticks are needed.
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "e.g. Ubuntu 24.04, container image, Kubernetes 1.31"

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Screenshots, configuration, or other context.
