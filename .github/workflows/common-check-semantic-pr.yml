# Reusable: validates that a pull request title is a Conventional Commit.
#
# This is not cosmetic. Repositories here squash-merge with
# squash_merge_commit_title: PR_TITLE, so the PR title *becomes* the commit
# subject on main. Without this check nothing validates the string that lands.
#
# PR_TITLE is chosen over GitHub's default COMMIT_OR_PR_TITLE precisely so the
# validated text is the text that lands: the default falls back to the commit
# subject on a single-commit PR, which this check never sees.
#
# Call it from a repository with:
#
#   jobs:
#     semantic-pr:
#       uses: skillsgateway/.github/.github/workflows/common-check-semantic-pr.yml@main

name: Check semantic PR

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  semantic-pr:
    name: Validate PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Scope is optional; the type is what git-cliff and any future release
          # automation key off.
          requireScope: false
          types: |
            feat
            fix
            refactor
            chore
            security
            revert
            test
            docs
            perf
            style
            ci
            build
